<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
<title>Zena CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600&display=swap">
<style>
  /* Layout: compact header, KPI strip, sticky pipeline tabs (confirmation | livraison), order cards; admin adds a performance view */
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f8f9fb; --ink: #111827; --ink-2: #374151; --muted: #6b7280; --line: #e5e7eb; --line-2: #eef0f3;
    --brand: #3651d4; --brand-ink: #ffffff; --brand-soft: #eef1ff;
    --ok: #0f7b55; --ok-soft: #e8f6f0; --bad: #c2362b; --bad-soft: #fdeeec;
    --warn: #b45309; --warn-soft: #fdf3e6; --info: #1d5fd1; --info-soft: #eaf1fd;
    --wa: #128c4a;
    --shadow: 0 1px 2px rgba(17, 24, 39, .04), 0 2px 8px rgba(17, 24, 39, .04);
    --r: 12px;
    --font: "Manrope", "Noto Sans Arabic", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1117; --panel: #161a22; --panel-2: #1b2029; --ink: #eef0f4; --ink-2: #cbd0d9; --muted: #8b93a3; --line: #262c37; --line-2: #1f242e;
      --brand: #8199ff; --brand-ink: #0b1030; --brand-soft: #1c2340;
      --ok: #43c08c; --ok-soft: #10261d; --bad: #f2786d; --bad-soft: #2e1715;
      --warn: #f0a54a; --warn-soft: #2d2012; --info: #78a6f5; --info-soft: #142038;
      --wa: #3cc47a; --shadow: none; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  main.wrap { padding-bottom: 80px; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* login */
  .login { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: min(100%, 360px); background: var(--panel); border-radius: 16px; padding: 32px 24px; box-shadow: var(--shadow); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
  .brandline { display: flex; align-items: center; gap: 10px; }
  .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 800; font-size: 17px; letter-spacing: -.02em; flex: none; }
  .brandname { font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
  .brandname span { color: var(--muted); font-weight: 600; }
  .login-card h1 { margin: 6px 0 0; font-size: 20px; letter-spacing: -.01em; }
  .login-card p { margin: 0; color: var(--muted); }
  .pin { text-align: center; font-size: 24px; letter-spacing: .4em; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); }
  .pin:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .btn { border: 1px solid transparent; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; background: var(--brand); color: var(--brand-ink); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.ghost { background: var(--panel); color: var(--ink-2); border-color: var(--line); }
  .err { color: var(--bad); font-size: 13px; min-height: 1.3em; }

  /* header */
  header.top { padding-top: env(safe-area-inset-top); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 0 12px; }
  .bar .brandline { flex: 1; min-width: 0; }
  .who { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .who b { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .who small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { height: 36px; min-width: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2); flex: none; }
  .icon-btn.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--line-2); gap: 3px; margin-bottom: 12px; }
  .seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
  .kpi { padding: 10px 14px; min-width: 0; border-inline-start: 1px solid var(--line-2); }
  .kpi:first-child { border-inline-start: 0; }
  .kpi span { display: block; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi b { font-size: 20px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

  .tools { display: flex; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .search { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 12px; }
  .search:focus, .sel:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .sel { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 10px; }
  .tabs-wrap { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: calc(8px + env(safe-area-inset-top)); padding-bottom: 10px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; align-items: center; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-group { flex: none; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 2px 0 6px; }
  .tab-group:first-child { padding-left: 0; }
  .tab { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 11px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .tab .n { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--line-2); font-size: 11.5px; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .tab[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .tab[aria-pressed="true"] .n { background: rgba(255,255,255,.16); color: inherit; }

  /* cards */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 14px 14px 18px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--line); }
  .card.t-ok::before { background: var(--ok); } .card.t-bad::before { background: var(--bad); }
  .card.t-warn::before { background: var(--warn); } .card.t-info::before { background: var(--info); }
  .row1 { display: flex; align-items: baseline; gap: 8px; }
  .name { font-weight: 800; font-size: 15px; letter-spacing: -.01em; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .date { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .date.late { color: var(--bad); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: 11.5px; padding: 3px 8px; border-radius: 6px; background: var(--line-2); color: var(--ink-2); font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
  .pill.plain::before { display: none; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.info { background: var(--info-soft); color: var(--info); }
  .pill.brand { background: var(--brand-soft); color: var(--brand); }
  .prod { font-size: 13.5px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 9px; padding: 8px 10px; overflow-wrap: anywhere; color: var(--ink-2); }
  .prod b { color: var(--ink); font-weight: 800; white-space: nowrap; }
  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13px; }
  .meta dt { color: var(--muted); font-weight: 600; }
  .meta dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
  .meta .code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  .contact { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .contact a { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; border-radius: 9px; padding: 9px; font-weight: 700; font-size: 13.5px; border: 1px solid var(--line); color: var(--ink); background: var(--panel); font-variant-numeric: tabular-nums; }
  .contact a.wa { color: var(--wa); border-color: color-mix(in srgb, var(--wa) 35%, var(--line)); background: color-mix(in srgb, var(--wa) 7%, var(--panel)); }
  .acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .act { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 8px 6px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .act .dot { width: 7px; height: 7px; border-radius: 50%; }
  .act.c-ok .dot { background: var(--ok); } .act.c-bad .dot { background: var(--bad); } .act.c-warn .dot { background: var(--warn); }
  .act[aria-pressed="true"].c-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .act[aria-pressed="true"].c-bad { background: var(--bad); border-color: var(--bad); color: #fff; }
  .act[aria-pressed="true"].c-warn { background: var(--warn); border-color: var(--warn); color: #fff; }
  .act[aria-pressed="true"] .dot { background: #fff; }
  .edit { display: grid; gap: 10px; padding-top: 4px; border-top: 1px dashed var(--line); }
  .edit label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .edit input, .edit textarea, .edit select { border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: 9px 10px; width: 100%; color: var(--ink); font-size: 14px; }
  .edit input:focus, .edit textarea:focus, .edit select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .edit textarea { min-height: 58px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .save-row { display: flex; gap: 8px; }
  .save-row .btn { flex: 1; }
  .more { background: none; border: 0; color: var(--brand); font-weight: 700; cursor: pointer; padding: 0; font-size: 13px; justify-self: start; display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; }
  .empty { text-align: center; color: var(--muted); padding: 48px 10px; }
  .toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-weight: 700; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .toast.bad { background: var(--bad); color: #fff; }
  .loadmore { width: 100%; margin-top: 12px; }

  /* performance */
  .periods { display: flex; gap: 6px; padding-bottom: 12px; flex-wrap: wrap; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; }
  .pcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
  .phead { display: flex; align-items: center; gap: 10px; }
  .phead b { font-weight: 800; letter-spacing: -.01em; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 12px; flex: none; }
  .ring { width: 66px; height: 66px; flex: none; }
  .ring-row { display: flex; align-items: center; gap: 14px; }
  .big { font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .sub { color: var(--muted); font-size: 12px; }
  .cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line-2); border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; }
  .cell { background: var(--panel); padding: 7px 9px; display: flex; flex-direction: column; min-width: 0; }
  .cell b { font-variant-numeric: tabular-nums; font-weight: 800; }
  .cell span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell.ok b { color: var(--ok); } .cell.bad b { color: var(--bad); } .cell.warn b { color: var(--warn); }
  .note { color: var(--muted); font-size: 12px; margin: 12px 0 0; }
  @media (max-width: 460px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi:nth-child(3) { border-inline-start: 0; }
    .kpi:nth-child(n+3) { border-top: 1px solid var(--line-2); }
    .who small { max-width: 160px; }
  }
  @media (prefers-reduced-motion: reduce) { .icon-btn.spin svg { animation: none; } }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.5 8.5 0 1 1 21 11.5z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></symbol>
</svg>

<section class="login" id="v-login">
  <div class="login-card">
    <div class="brandline"><div class="mark">Z</div><div class="brandname">Zena <span>CRM</span></div></div>
    <h1>Connexion</h1>
    <p>Entrez votre code personnel.</p>
    <input class="pin" id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="Code">
    <button class="btn" id="go">Se connecter</button>
    <div class="err" id="login-err"></div>
  </div>
</section>

<div id="v-app" hidden>
  <header class="top">
    <div class="wrap">
      <div class="bar">
        <div class="brandline">
          <div class="mark">Z</div>
          <div class="who"><b id="me">—</b><small id="sync">—</small></div>
        </div>
        <button class="icon-btn" id="refresh" aria-label="Actualiser"><svg class="i"><use href="#i-refresh"/></svg></button>
        <button class="icon-btn" id="logout" aria-label="Déconnexion"><svg class="i"><use href="#i-out"/></svg><span>Quitter</span></button>
      </div>
      <div class="seg" id="views" role="group" aria-label="Vue">
        <button data-view="orders" aria-pressed="true">Commandes</button>
        <button data-view="perf" aria-pressed="false">Performance</button>
      </div>
      <div id="orders-head">
        <div class="kpis" id="kpis"></div>
        <div class="tools">
          <input class="search" id="q" type="search" placeholder="Rechercher un nom, un numéro, un colis…" aria-label="Rechercher">
          <select class="sel" id="f-agent" hidden aria-label="Agente"></select>
          <select class="sel" id="f-jours" hidden aria-label="Période">
            <option value="1">Aujourd'hui</option><option value="3">3 jours</option><option value="7" selected>7 jours</option><option value="30">30 jours</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="orders">
      <div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>
      <div class="list" id="list"></div>
      <button class="btn ghost loadmore" id="more" hidden>Afficher plus</button>
    </section>
    <section id="perf" hidden>
      <div class="periods" id="periods">
        <button class="tab" data-p="aujourdhui">Aujourd'hui</button>
        <button class="tab" data-p="7j" aria-pressed="true">7 jours</button>
        <button class="tab" data-p="30j">30 jours</button>
        <button class="tab" data-p="tout">Tout</button>
      </div>
      <div class="pgrid" id="pgrid"></div>
      <p class="note" id="perf-note">Taux de confirmation = confirmées ÷ (commandes − doublons). Taux de livraison = livrées ÷ (livrées + retours). Calculé toutes les 15 minutes.</p>
    </section>
  </main>
</div>

<datalist id="villes"></datalist>
<div class="toast" id="toast" hidden></div>

<script>
const API = 'https://n8n.srv2034083.hstgr.cloud/webhook/crm';
const STATUTS = [
  { v: 'CONFIRMER', t: 'Confirmé', c: 'ok' },
  { v: 'PS REPOND', t: 'Pas répondu', c: 'warn' },
  { v: '2 PS RPS', t: 'Injoignable ×2', c: 'warn' },
  { v: 'MESSAGE WTSP', t: 'Msg WhatsApp', c: 'warn' },
  { v: 'ANNULER', t: 'Annulé', c: 'bad' },
  { v: 'DOUBLE', t: 'Doublon', c: 'bad' },
];
const LABEL = Object.fromEntries(STATUTS.map(s => [s.v, s.t]));
const TON = Object.fromEntries(STATUTS.map(s => [s.v, s.c]));
const AGENTES = ['HAJIBA', 'BTISSAM', 'GHIZLANE', 'SAMIRA', 'SOUMIA', 'SANAA'];
const COULEURS = { HAJIBA: '#3651d4', BTISSAM: '#7c4dbe', GHIZLANE: '#c2362b', SAMIRA: '#0e7490', SOUMIA: '#b45309', SANAA: '#0f7b55' };
const nomPropre = a => a ? a.charAt(0) + a.slice(1).toLowerCase() : '';

// Statuts de livraison (Irsaliyat / Colya). Les messages WhatsApp aux clients restent en darija.
const GROUPES = [
  { id: 'pr', t: 'Injoignable', c: 'warn', f: s => /r[ée]pond|injoign|joignable|bo[iî]te vocale|ferm[ée]/i.test(s), msg: 'السلام عليكم {c}، معاك Zena Shop. الليفرور حاول يتاصل بيك باش يسلم ليك الطلب ديالك ({p}) وما جاوبتيش. واش نقولو ليه يدوز عندك اليوم؟' },
  { id: 'an', t: 'Refusées', c: 'bad', f: s => /annul|refus/i.test(s), msg: 'السلام عليكم {c}، معاك Zena Shop. شفنا الطلب ديالك ({p}) تلغى. واش كاين شي مشكل نقدرو نعاونوك فيه؟ إلا مازال بغيتيه نعاودو نصيفطوه ليك.' },
  { id: 'rp', t: 'Reportées', c: 'info', f: s => /report|int[ée]ress|programm|rendez/i.test(s), msg: 'السلام عليكم {c}، معاك Zena Shop بخصوص الطلب ديالك ({p}). فوقاش يناسبك نصيفطو ليك الليفرور؟' },
  { id: 'rt', t: 'Retours', c: 'bad', f: s => /retour|retourn/i.test(s), msg: '' },
  { id: 'ok', t: 'Livrées', c: 'ok', f: s => /^livr[ée] au client/i.test(s), msg: 'السلام عليكم {c}، معاك Zena Shop. شكرا على الثقة ديالك 🌸 عجبك المنتوج ({p})؟' },
  { id: 'rd', t: 'En cours', c: 'info', f: () => true, msg: 'السلام عليكم {c}، معاك Zena Shop. الطلب ديالك ({p}) خرج مع شركة التوصيل وغادي يوصلك قريب إن شاء الله. خلي التيليفون ديالك مشعول عافاك.' },
];
const MSG_DEFAUT = 'السلام عليكم {c}، معاك Zena Shop بخصوص الطلب ديالك: {p}';
const PS = ['PS REPOND', '2 PS RPS', 'MESSAGE WTSP'];
const gLiv = o => (GROUPES.find(g => g.f(o.livraison || '')) || {}).id;
const TABS = [
  { groupe: 'Confirmation' },
  { id: 'new', t: 'Nouvelles', c: 'info', f: o => !o.colis && !o.statut },
  { id: 'ps', t: 'Pas répondu', c: 'warn', f: o => !o.colis && PS.includes(o.statut) },
  { id: 'ok', t: 'Confirmées · à expédier', c: 'ok', f: o => !o.colis && o.statut === 'CONFIRMER' },
  { id: 'ko', t: 'Annulées', c: 'bad', f: o => !o.colis && ['ANNULER', 'DOUBLE'].includes(o.statut) },
  { groupe: 'Livraison' },
  { id: 'l-pr', t: 'Client injoignable', c: 'warn', f: o => !!o.colis && gLiv(o) === 'pr' },
  { id: 'l-an', t: 'Refusées', c: 'bad', f: o => !!o.colis && gLiv(o) === 'an' },
  { id: 'l-rp', t: 'Reportées', c: 'info', f: o => !!o.colis && gLiv(o) === 'rp' },
  { id: 'l-rd', t: 'En cours', c: 'info', f: o => !!o.colis && gLiv(o) === 'rd' },
  { id: 'l-rt', t: 'Retours', c: 'bad', f: o => !!o.colis && gLiv(o) === 'rt' },
  { id: 'l-ok', t: 'Livrées', c: 'ok', f: o => !!o.colis && gLiv(o) === 'ok' },
  { groupe: '' },
  { id: 'all', t: 'Toutes', c: '', f: () => true },
];
const TONCOL = { ok: 'var(--ok)', bad: 'var(--bad)', warn: 'var(--warn)', info: 'var(--info)', '': 'var(--muted)' };

const st = { pin: '', agent: '', role: '', commandes: [], tab: 'new', q: '', page: 1, ouvert: new Set(), brouillon: {}, villes: [], stats: [], periode: '7j', view: 'orders', at: 0, busy: false };
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
};
const icone = id => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'i'); const u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', '#i-' + id); s.append(u); return s; };
const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} } };

async function api(action, extra = {}) {
  const body = new URLSearchParams({ payload: JSON.stringify({ pin: st.pin, action, ...extra }) });
  let r;
  try { r = await fetch(API, { method: 'POST', body }); } catch (e) { throw new Error('Pas de connexion. Vérifiez internet et réessayez.'); }
  if (!r.ok) throw new Error('Le serveur ne répond pas (' + r.status + '). Réessayez dans un instant.');
  const d = await r.json();
  if (!d.ok) throw new Error(d.erreur || 'Une erreur est survenue.');
  return d;
}
let toastT;
function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, bad ? 4500 : 2200); }

// ---------- login ----------
async function login(pin) {
  st.pin = pin;
  const d = await api('login');
  st.agent = d.agent; st.role = d.role;
  store.set('crm_pin', pin);
  $('#v-login').hidden = true; $('#v-app').hidden = false;
  $('#me').textContent = st.role === 'admin' ? 'Administration' : nomPropre(st.agent);
  if (st.role === 'admin') {
    $('#f-agent').hidden = false; $('#f-jours').hidden = false;
    $('#f-agent').replaceChildren(el('option', { value: 'TOUS', text: 'Toutes les agentes' }), el('option', { value: 'LIBRE', text: 'Non attribuées' }), ...AGENTES.map(a => el('option', { value: a, text: nomPropre(a) })), el('option', { value: 'NO APPEL', text: 'No appel' }));
  }
  charger();
  api('villes').then(d => { st.villes = d.villes; $('#villes').replaceChildren(...d.villes.map(v => el('option', { value: v }))); }).catch(() => {});
  chargerStats();
}
$('#go').addEventListener('click', async () => {
  const p = $('#pin').value.trim(); if (!p) return;
  $('#go').disabled = true; $('#login-err').textContent = '';
  try { await login(p); } catch (e) { $('#login-err').textContent = e.message; } finally { $('#go').disabled = false; }
});
$('#pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
$('#logout').addEventListener('click', () => { store.set('crm_pin', ''); location.reload(); });

// ---------- data ----------
async function charger(silencieux) {
  if (st.busy) return; st.busy = true;
  $('#refresh').classList.add('spin');
  try {
    const extra = st.role === 'admin' ? { filtre: $('#f-agent').value, jours: Number($('#f-jours').value) } : {};
    const d = await api('commandes', extra);
    st.commandes = d.commandes; st.at = Date.now();
    rendre();
  } catch (e) { if (!silencieux) toast(e.message, true); }
  finally { st.busy = false; $('#refresh').classList.remove('spin'); majSync(); }
}
async function chargerStats() {
  try { const d = await api('stats'); st.stats = d.stats; rendreKpis(); rendrePerf(); } catch (e) {}
}
function majSync() {
  if (!st.at) { $('#sync').textContent = 'Chargement…'; return; }
  const m = Math.round((Date.now() - st.at) / 60000);
  $('#sync').textContent = (m < 1 ? 'À jour' : 'Mis à jour il y a ' + m + ' min') + ' · ' + st.commandes.length + ' commandes';
}
setInterval(majSync, 30000);
setInterval(() => { if (document.visibilityState === 'visible' && st.pin && !st.ouvert.size && st.view === 'orders') charger(true); }, 90000);
setInterval(() => { if (document.visibilityState === 'visible' && st.pin) chargerStats(); }, 300000);
$('#refresh').addEventListener('click', () => { charger(); chargerStats(); });
$('#f-agent').addEventListener('change', () => charger());
$('#f-jours').addEventListener('change', () => charger());
$('#q').addEventListener('input', e => { st.q = e.target.value.trim().toLowerCase(); st.page = 1; rendre(); });

// ---------- rendering ----------
function depuis(v) {
  const t = Date.parse(String(v || '').replace(' ', 'T')); if (!t) return { t: '', h: 0 };
  const m = Math.max(1, Math.round((Date.now() - t) / 60000)), h = m / 60;
  if (m < 60) return { t: 'il y a ' + m + ' min', h };
  if (h < 24) return { t: 'il y a ' + Math.round(h) + ' h', h };
  const d = new Date(t);
  return { t: d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) + ', ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }), h };
}
function visibles() {
  const q = st.q;
  return st.commandes.filter(o => !q || (o.client + ' ' + o.tel + ' ' + o.id + ' ' + o.adresse + ' ' + o.ville + ' ' + (o.colis || '')).toLowerCase().includes(q));
}
function rendre() { rendreTabs(); rendreListe(); }
function rendreTabs() {
  const base = visibles();
  $('#tabs').replaceChildren(...TABS.map(t => t.groupe !== undefined
    ? (t.groupe ? el('span', { class: 'tab-group', text: t.groupe }) : null)
    : el('button', { class: 'tab', 'aria-pressed': String(st.tab === t.id), onclick: () => { st.tab = t.id; st.page = 1; rendre(); } },
        t.c ? el('span', { class: 'dot', style: 'background:' + TONCOL[t.c] }) : null, t.t, el('span', { class: 'n', text: base.filter(t.f).length }))));
}
function rendreListe() {
  const tab = TABS.find(t => t.id === st.tab);
  const rows = visibles().filter(tab.f);
  const n = st.page * 40;
  if (!rows.length) { $('#list').replaceChildren(el('div', { class: 'empty', text: st.at ? 'Aucune commande dans cette liste.' : 'Chargement des commandes…' })); $('#more').hidden = true; return; }
  $('#list').replaceChildren(...rows.slice(0, n).map(carte));
  $('#more').hidden = rows.length <= n;
}
$('#more').addEventListener('click', () => { st.page++; rendreListe(); });

function tonLivraison(s) { return /livr[ée] au client/i.test(s) ? 'ok' : /retour|annul|refus/i.test(s) ? 'bad' : /r[ée]pond|injoign|report/i.test(s) ? 'warn' : 'info'; }
function carte(o) {
  const key = (o.id || o.colis) + '|' + o.row;
  const gl = o.colis ? GROUPES.find(g => g.f(o.livraison || '')) : null;
  const b = st.brouillon[key] || (st.brouillon[key] = {});
  const statut = 'statut' in b ? b.statut : o.statut;
  const t9 = o.tel.replace(/\D/g, '').slice(-9);
  const ouvert = st.ouvert.has(key);
  const libre = !o.agent && !o.colis;
  const ton = gl ? gl.c : statut ? TON[statut] : 'info';
  const quand = gl ? depuis(o.dliv || o.date) : depuis(o.date);
  const enRetard = gl && ['pr', 'an', 'rp', 'rd'].includes(gl.id) && quand.h > 48;

  const chips = el('div', { class: 'chips' },
    gl ? el('span', { class: 'pill ' + tonLivraison(o.livraison), text: o.livraison || 'Expédiée' })
       : statut ? el('span', { class: 'pill ' + TON[statut], text: LABEL[statut] || statut }) : el('span', { class: 'pill info', text: 'Nouvelle' }),
    libre ? el('span', { class: 'pill brand plain', text: 'Non attribuée' }) : (st.role === 'admin' && o.agent ? el('span', { class: 'pill plain', text: nomPropre(o.agent) }) : null),
    !gl && o.wa ? el('span', { class: 'pill ' + (/oui|✅/i.test(o.wa) ? 'ok' : /non|❌/i.test(o.wa) ? 'bad' : 'plain'), text: 'WhatsApp : ' + o.wa.replace(/[✅❌⏳]\s*/g, '') }) : null,
    o.ancien ? el('span', { class: 'pill plain', text: 'Client fidèle' }) : null,
  );

  const msg = encodeURIComponent(((gl ? gl.msg : MSG_DEFAUT) || MSG_DEFAUT).replace('{c}', o.client || '').replace('{p}', o.produit || ''));
  const contact = t9.length === 9 ? el('div', { class: 'contact' },
    el('a', { href: 'tel:0' + t9 }, icone('phone'), '0' + t9),
    el('a', { class: 'wa', href: 'https://wa.me/212' + t9 + '?text=' + msg, target: '_blank', rel: 'noopener' }, icone('chat'), 'WhatsApp'),
  ) : null;

  const acts = el('div', { class: 'acts' }, ...STATUTS.map(s => el('button', {
    class: 'act c-' + s.c, 'aria-pressed': String(statut === s.v),
    onclick: () => { b.statut = statut === s.v ? '' : s.v; if (b.statut === 'CONFIRMER') st.ouvert.add(key); rerender(); },
  }, el('span', { class: 'dot' }), s.t)));

  const val = k => (k in b ? b[k] : (o[k] || ''));
  const champ = (k, label, type) => el('label', {}, label, type === 'area'
    ? el('textarea', { oninput: e => { b[k] = e.target.value; } }, val(k))
    : el('input', { value: val(k), list: k === 'ville' ? 'villes' : null, oninput: e => { b[k] = e.target.value; }, autocomplete: 'off' }));
  const edit = ouvert ? el('div', { class: 'edit' },
    el('div', { class: 'two' }, champ('ville', 'Ville (liste Irsaliyat)'), champ('total', 'Prix')),
    champ('adresse', 'Adresse', 'area'),
    champ('produit', 'Produit (taille, nombre de pièces)', 'area'),
    champ('remarque', 'Remarque'),
    st.role === 'admin' ? el('label', {}, 'Agente', el('select', { onchange: e => { b.agent = e.target.value; } },
      el('option', { value: '', text: '—' }), ...[...AGENTES, 'NO APPEL'].map(a => el('option', { value: a, text: nomPropre(a), selected: val('agent') === a })))) : null,
  ) : null;

  const modifs = Object.keys(b).filter(k => (b[k] ?? '') !== (o[k] ?? ''));
  const save = (modifs.length || ouvert) ? el('div', { class: 'save-row' },
    el('button', { class: 'btn', onclick: ev => enregistrer(o, key, ev.currentTarget) }, 'Enregistrer'),
    el('button', { class: 'btn ghost', onclick: () => { delete st.brouillon[key]; st.ouvert.delete(key); rerender(); } }, 'Annuler'),
  ) : null;

  const meta = el('dl', { class: 'meta' },
    el('dt', { text: 'Ville' }), el('dd', { text: o.ville || '—' }),
    o.adresse ? el('dt', { text: 'Adresse' }) : null, o.adresse ? el('dd', { text: o.adresse }) : null,
    o.colis ? el('dt', { text: 'Colis' }) : null, o.colis ? el('dd', { class: 'code', text: o.colis }) : null,
    o.remarque ? el('dt', { text: 'Remarque' }) : null, o.remarque ? el('dd', { text: o.remarque }) : null,
  );

  return el('article', { class: 'card t-' + ton, 'data-key': key },
    el('div', { class: 'row1' }, el('div', { class: 'name', text: o.client || '—' }), el('div', { class: 'date' + (enRetard ? ' late' : ''), text: quand.t })),
    chips,
    el('div', { class: 'prod' }, o.produit || '—', o.total ? el('b', { text: '  ·  ' + o.total.replace('درهم', 'DH') }) : null),
    meta,
    contact, gl ? null : acts,
    gl ? null : el('button', { class: 'more', onclick: () => { ouvert ? st.ouvert.delete(key) : st.ouvert.add(key); rerender(); } }, icone('edit'), ouvert ? 'Fermer' : 'Modifier ville, adresse, produit'),
    edit, save,
  );
}
function rerender() { const y = window.scrollY; rendre(); window.scrollTo(0, y); }
async function enregistrer(o, key, btn) {
  const b = st.brouillon[key];
  const champs = {};
  for (const k of Object.keys(b)) if ((b[k] ?? '') !== (o[k] ?? '')) champs[k] = b[k];
  if (!Object.keys(champs).length) { st.ouvert.delete(key); rerender(); return; }
  if (champs.statut === 'CONFIRMER' && !(champs.ville || o.ville)) { toast('Choisissez la ville avant de confirmer.', true); st.ouvert.add(key); rerender(); return; }
  if (champs.ville && st.villes.length && !st.villes.includes(champs.ville)) { toast('Choisissez une ville de la liste.', true); return; }
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  try {
    const d = await api('maj', { row: o.row, id: o.id, champs });
    Object.assign(o, champs);
    if (d.champs && d.champs.agent !== undefined) o.agent = String(d.champs.agent).toUpperCase();
    delete st.brouillon[key]; st.ouvert.delete(key);
    toast('Enregistré'); rerender();
  } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = 'Enregistrer'; }
}

// ---------- KPIs + performance ----------
const fmt = n => (Number(n) || 0).toLocaleString('fr-FR');
const pct = n => (Math.round((Number(n) || 0) * 10) / 10).toLocaleString('fr-FR') + ' %';
function rendreKpis() {
  const moi = st.role === 'admin' ? 'TOTAL' : st.agent;
  const auj = st.stats.find(r => r.agent === moi && r.periode === 'aujourdhui') || {};
  const s7 = st.stats.find(r => r.agent === moi && r.periode === '7j') || {};
  $('#kpis').replaceChildren(
    el('div', { class: 'kpi' }, el('span', { text: "Commandes · auj." }), el('b', { text: fmt(auj.assignes) })),
    el('div', { class: 'kpi' }, el('span', { text: "Confirmées · auj." }), el('b', { text: fmt(auj.confirmes) })),
    el('div', { class: 'kpi' }, el('span', { text: 'Confirmation · 7 j' }), el('b', { text: pct(s7.taux_conf) })),
    el('div', { class: 'kpi' }, el('span', { text: 'Livraison · 7 j' }), el('b', { text: pct(s7.taux_livr) })),
  );
}
function anneau(taux, col) {
  const NS = 'http://www.w3.org/2000/svg', R = 28, L = 2 * Math.PI * R;
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 66 66'); svg.setAttribute('class', 'ring');
  const c1 = document.createElementNS(NS, 'circle'); Object.entries({ cx: 33, cy: 33, r: R, fill: 'none', stroke: 'var(--line-2)', 'stroke-width': 6 }).forEach(([k, v]) => c1.setAttribute(k, v));
  const c2 = document.createElementNS(NS, 'circle'); Object.entries({ cx: 33, cy: 33, r: R, fill: 'none', stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-dasharray': (L * Math.min(100, Math.max(0, taux)) / 100) + ' ' + L, transform: 'rotate(-90 33 33)' }).forEach(([k, v]) => c2.setAttribute(k, v));
  const t = document.createElementNS(NS, 'text'); Object.entries({ x: 33, y: 38, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 800, fill: 'currentColor' }).forEach(([k, v]) => t.setAttribute(k, v)); t.textContent = Math.round(taux) + '%';
  svg.append(c1, c2, t); return svg;
}
function cell(v, label, ton) { return el('div', { class: 'cell' + (ton ? ' ' + ton : '') }, el('b', { text: v }), el('span', { text: label })); }
function rendrePerf() {
  const rows = st.stats.filter(r => r.periode === st.periode && r.agent !== 'TOTAL' && (Number(r.assignes) > 0 || Number(r.colis) > 0));
  rows.sort((a, b) => Number(b.confirmes) - Number(a.confirmes));
  const tot = st.stats.find(r => r.periode === st.periode && r.agent === 'TOTAL');
  const cartes = rows.map(r => {
    const col = COULEURS[r.agent] || 'var(--brand)';
    const tl = Number(r.taux_livr) || 0, fermes = Number(r.livres) + Number(r.retours);
    return el('div', { class: 'pcard' },
      el('div', { class: 'phead' }, el('div', { class: 'avatar', style: 'background:' + col, text: r.agent.slice(0, 2) }), el('b', { text: nomPropre(r.agent) })),
      el('div', { class: 'ring-row' }, anneau(Number(r.taux_conf) || 0, col), el('div', {}, el('div', { class: 'big', text: fmt(r.confirmes) }), el('div', { class: 'sub', text: 'confirmées sur ' + fmt(r.assignes) + ' commandes' }))),
      el('div', { class: 'cells' },
        cell(fmt(r.annules), 'Annulées', Number(r.annules) ? 'bad' : ''), cell(fmt(r.pas_repond), 'Pas répondu', Number(r.pas_repond) ? 'warn' : ''), cell(fmt(r.en_attente), 'En attente'),
        cell(fmt(r.livres), 'Livrées', 'ok'), cell(fmt(r.retours), 'Retours', Number(r.retours) ? 'bad' : ''), cell(fermes ? pct(tl) : '—', 'Taux livraison', !fermes ? '' : tl >= 50 ? 'ok' : tl >= 35 ? 'warn' : 'bad'),
        cell(fmt(r.en_cours), 'En cours'), cell(fmt(r.colis), 'Colis'), cell(fmt(r.ca_livre) + ' DH', 'CA livré'),
      ),
    );
  });
  if (tot && st.role === 'admin') cartes.unshift(el('div', { class: 'pcard' },
    el('div', { class: 'phead' }, el('div', { class: 'avatar', style: 'background:var(--ink);color:var(--panel)', text: 'Σ' }), el('b', { text: 'Total équipe' })),
    el('div', { class: 'ring-row' }, anneau(Number(tot.taux_conf) || 0, 'var(--brand)'), el('div', {}, el('div', { class: 'big', text: fmt(tot.confirmes) }), el('div', { class: 'sub', text: 'confirmées sur ' + fmt(tot.assignes) + ' commandes' }))),
    el('div', { class: 'cells' }, cell(fmt(tot.livres), 'Livrées', 'ok'), cell(fmt(tot.retours), 'Retours', 'bad'), cell(pct(tot.taux_livr), 'Taux livraison'), cell(fmt(tot.en_cours), 'En cours'), cell(fmt(tot.en_attente), 'En attente'), cell(fmt(tot.ca_livre) + ' DH', 'CA livré')),
  ));
  $('#pgrid').replaceChildren(...(cartes.length ? cartes : [el('div', { class: 'empty', text: 'Aucune activité sur cette période.' })]));
  const maj = (tot || rows[0] || {}).maj;
  if (maj) $('#perf-note').textContent = 'Taux de confirmation = confirmées ÷ (commandes − doublons). Taux de livraison = livrées ÷ (livrées + retours). Dernier calcul : ' + maj + '.';
}
for (const b of document.querySelectorAll('#periods .tab')) b.addEventListener('click', () => {
  st.periode = b.dataset.p; for (const x of document.querySelectorAll('#periods .tab')) x.setAttribute('aria-pressed', String(x === b)); rendrePerf();
});
for (const b of document.querySelectorAll('#views button')) b.addEventListener('click', () => {
  st.view = b.dataset.view;
  for (const x of document.querySelectorAll('#views button')) x.setAttribute('aria-pressed', String(x === b));
  $('#orders').hidden = st.view !== 'orders'; $('#orders-head').hidden = st.view !== 'orders'; $('#perf').hidden = st.view !== 'perf';
  if (st.view === 'perf') chargerStats();
});

// ---------- start ----------
const saved = store.get('crm_pin');
if (saved) login(saved).catch(() => { store.set('crm_pin', ''); $('#v-login').hidden = false; $('#v-app').hidden = true; });
</script>

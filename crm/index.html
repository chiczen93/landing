<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
<title>Zena CRM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zena CRM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: compact header, KPI strip, sticky pipeline tabs (confirmation | livraison), order cards; admin adds a performance view */
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f8f9fb; --ink: #111827; --ink-2: #374151; --muted: #6b7280; --line: #e5e7eb; --line-2: #eef0f3;
    --brand: #3651d4; --brand-ink: #ffffff; --brand-soft: #eef1ff;
    --ok: #0f7b55; --ok-soft: #e8f6f0; --bad: #c2362b; --bad-soft: #fdeeec;
    --warn: #b45309; --warn-soft: #fdf3e6; --info: #1d5fd1; --info-soft: #eaf1fd;
    --wa: #128c4a;
    --shadow: 0 1px 2px rgba(17, 24, 39, .04), 0 2px 8px rgba(17, 24, 39, .04);
    --r: 12px;
    --font: "Manrope", "Cairo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1117; --panel: #161a22; --panel-2: #1b2029; --ink: #eef0f4; --ink-2: #cbd0d9; --muted: #8b93a3; --line: #262c37; --line-2: #1f242e;
      --brand: #8199ff; --brand-ink: #0b1030; --brand-soft: #1c2340;
      --ok: #43c08c; --ok-soft: #10261d; --bad: #f2786d; --bad-soft: #2e1715;
      --warn: #f0a54a; --warn-soft: #2d2012; --info: #78a6f5; --info-soft: #142038;
      --wa: #3cc47a; --shadow: none; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  main.wrap { padding-bottom: 80px; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* login */
  .login { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: min(100%, 360px); background: var(--panel); border-radius: 16px; padding: 32px 24px; box-shadow: var(--shadow); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
  .brandline { display: flex; align-items: center; gap: 10px; }
  .mark img { width: 100%; height: 100%; display: block; }
  .mark { overflow: hidden; width: 34px; height: 34px; border-radius: 9px; background: #11141c; color: var(--brand-ink); display: grid; place-items: center; font-weight: 800; font-size: 17px; letter-spacing: -.02em; flex: none; }
  .brandname { font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
  .brandname span { color: var(--muted); font-weight: 600; }
  .login-card h1 { margin: 6px 0 0; font-size: 20px; letter-spacing: -.01em; }
  .login-card p { margin: 0; color: var(--muted); }
  .pin { text-align: center; font-size: 24px; letter-spacing: .4em; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); }
  .pin:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .btn { border: 1px solid transparent; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; background: var(--brand); color: var(--brand-ink); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.ghost { background: var(--panel); color: var(--ink-2); border-color: var(--line); }
  .err { color: var(--bad); font-size: 13px; min-height: 1.3em; }

  /* header */
  header.top { padding-top: env(safe-area-inset-top); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 0 12px; }
  .bar .brandline { flex: 1; min-width: 0; }
  .who { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .who b { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .who small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { height: 36px; min-width: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2); flex: none; }
  .icon-btn.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .vocal { display: flex; align-items: center; gap: 6px; max-width: 100%; }
  .vocal audio { flex: 1; min-width: 0; }
  .vocal .vit { flex: none; min-width: 44px; height: 32px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-weight: 800; font-size: 13px; cursor: pointer; }
  .classement { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 14px; }
  .cl-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .cl-top h3 { margin: 0; font-size: 16px; }
  .cl-sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .podium { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 12px; }
  .podium .p { flex: 1; text-align: center; min-width: 0; }
  .podium .av { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; position: relative; }
  .podium .p1 .av { width: 58px; height: 58px; }
  .podium .md { position: absolute; bottom: -6px; right: -8px; font-size: 20px; }
  .podium b { display: block; font-size: 13px; } .podium small { font-size: 11px; color: var(--muted); }
  .podium .bloc { margin-top: 6px; border-radius: 10px 10px 0 0; background: var(--line-2); font-weight: 800; font-size: 20px; padding-top: 6px; }
  .podium .p1 .bloc { background: #facc1526; color: #ca8a04; }
  .cl-list { display: flex; flex-direction: column; gap: 7px; }
  .cl-l { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; background: var(--panel-2); }
  .cl-l .r { width: 22px; font-weight: 800; font-size: 16px; text-align: center; color: var(--muted); flex: none; }
  .cl-l .avatar { flex: none; }
  .cl-l .x { flex: 1; min-width: 0; }
  .cl-l .x > b { display: flex; justify-content: space-between; font-size: 14px; }
  .cl-l .cl-bar { height: 6px; border-radius: 3px; background: var(--line-2); margin: 6px 0 4px; overflow: hidden; }
  .cl-l .cl-bar i { display: block; height: 100%; border-radius: 3px; }
  .cl-l .x > span { font-size: 12px; color: var(--muted); }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--line-2); gap: 3px; margin-bottom: 12px; }
  .seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
  .kpi { padding: 10px 14px; min-width: 0; border-inline-start: 1px solid var(--line-2); }
  .kpi:first-child { border-inline-start: 0; }
  .kpi span { display: block; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi b { font-size: 20px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

  .tools { display: flex; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .search { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 12px; }
  .search:focus, .sel:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .sel { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 10px; }
  .tabs-wrap { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: calc(8px + env(safe-area-inset-top)); padding-bottom: 10px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; align-items: center; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-group { flex: none; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 2px 0 6px; }
  .tab-group:first-child { padding-left: 0; }
  .tab { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 11px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .tab .n { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--line-2); font-size: 11.5px; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .tab[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .tab[aria-pressed="true"] .n { background: rgba(255,255,255,.16); color: inherit; }

  /* cards */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 14px 14px 18px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--line); }
  .card.t-ok::before { background: var(--ok); } .card.t-bad::before { background: var(--bad); }
  .card.t-warn::before { background: var(--warn); } .card.t-info::before { background: var(--info); }
  .row1 { display: flex; align-items: baseline; gap: 8px; }
  .name { font-weight: 800; font-size: 15px; letter-spacing: -.01em; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .date { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .date.late { color: var(--bad); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: 11.5px; padding: 3px 8px; border-radius: 6px; background: var(--line-2); color: var(--ink-2); font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
  .pill.plain::before { display: none; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.info { background: var(--info-soft); color: var(--info); }
  .pill.brand { background: var(--brand-soft); color: var(--brand); }
  .prod { font-size: 13.5px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 9px; padding: 8px 10px; overflow-wrap: anywhere; color: var(--ink-2); }
  .prod b { color: var(--ink); font-weight: 800; white-space: nowrap; }
  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13px; }
  .meta dt { color: var(--muted); font-weight: 600; }
  .meta dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
  .meta .code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  .contact { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .contact a { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; border-radius: 9px; padding: 9px; font-weight: 700; font-size: 13.5px; border: 1px solid var(--line); color: var(--ink); background: var(--panel); font-variant-numeric: tabular-nums; }
  .contact a.wa { color: var(--wa); border-color: color-mix(in srgb, var(--wa) 35%, var(--line)); background: color-mix(in srgb, var(--wa) 7%, var(--panel)); }
  .acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .act { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 8px 6px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .act .dot { width: 7px; height: 7px; border-radius: 50%; }
  .act.c-info .dot { background: var(--info); } .act[aria-pressed="true"].c-info { background: var(--info); border-color: var(--info); color: #fff; }
  .act.c-ok .dot { background: var(--ok); } .act.c-bad .dot { background: var(--bad); } .act.c-warn .dot { background: var(--warn); }
  .act[aria-pressed="true"].c-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .act[aria-pressed="true"].c-bad { background: var(--bad); border-color: var(--bad); color: #fff; }
  .act[aria-pressed="true"].c-warn { background: var(--warn); border-color: var(--warn); color: #fff; }
  .act[aria-pressed="true"] .dot { background: #fff; }
  .edit { display: grid; gap: 10px; padding-top: 4px; border-top: 1px dashed var(--line); }
  .edit label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .edit input, .edit textarea, .edit select { border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: 9px 10px; width: 100%; color: var(--ink); font-size: 14px; }
  .edit input:focus, .edit textarea:focus, .edit select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .edit textarea { min-height: 58px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .save-row { display: flex; gap: 8px; }
  .save-row .btn { flex: 1; }
  .more { background: none; border: 0; color: var(--brand); font-weight: 700; cursor: pointer; padding: 0; font-size: 13px; justify-self: start; display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; }
  .empty { text-align: center; color: var(--muted); padding: 48px 10px; }
  .pwa-bar { display: flex; align-items: center; gap: 10px; background: var(--brand-soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .pwa-bar[hidden] { display: none; }
  .pwa-bar img { width: 34px; height: 34px; border-radius: 9px; flex: none; }
  .pwa-bar span { flex: 1; line-height: 1.4; }
  .pwa-bar button { flex: none; }
  .pwa-bar .x { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .fab-chat { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 50%; border: 0; background: #22c55e; color: #fff; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(34,197,94,.4); z-index: 40; cursor: pointer; }
  .fab-chat[hidden] { display: none; }
  .fab-camion { position: fixed; right: 20px; bottom: calc(90px + env(safe-area-inset-bottom)); width: 50px; height: 50px; border-radius: 50%; border: 0; background: #f59e0b; font-size: 24px; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(245,158,11,.4); z-index: 40; cursor: pointer; }
  .fab-camion[hidden] { display: none; }
  .fab-camion .b { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; border-radius: 11px; background: #ef4444; color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; padding: 0 6px; border: 2px solid var(--bg); }
  .fab-camion.alerte { animation: fab-secoue 1.6s ease-in-out infinite; }
  .car-fond { position: fixed; inset: 0; z-index: 92; background: rgba(4,6,10,.88); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); display: flex; flex-direction: column; padding: calc(14px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom)); }
  .car-top { text-align: center; color: #e8ebf2; padding: 6px 16px 10px; }
  .car-top b { display: block; font-size: 16px; } .car-top span { display: block; font-size: 12.5px; color: #8a93a6; margin-top: 2px; }
  .car-top em { display: inline-block; font-style: normal; margin-top: 6px; font-size: 11.5px; font-weight: 800; color: #fbbf24; background: #3a2a10; border-radius: 20px; padding: 4px 10px; }
  .car-piste { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .car-piste::-webkit-scrollbar { display: none; }
  .car-slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; padding: 0 22px; overflow-y: auto; }
  .car-slide .alr { animation: none; max-height: 100%; }
  .alr.vert { border-color: #1f4d33; }
  .car-fl { position: absolute; top: 50%; width: 30px; height: 60px; border: 0; background: none; color: #8a93a6; font-size: 30px; cursor: pointer; }
  .car-fl.g { left: 0; } .car-fl.d { right: 0; }
  .car-dots { display: flex; justify-content: center; gap: 6px; padding: 12px 0 6px; flex-wrap: wrap; }
  .car-dots i { width: 8px; height: 8px; border-radius: 4px; background: #3a4155; transition: width .2s; }
  .car-dots i.ok { background: #22c55e; } .car-dots i.on { width: 22px; background: #e8ebf2; } .car-dots i.ok.on { background: #4ade80; }
  .car-pied { text-align: center; font-size: 12px; color: #ff9a9a; padding: 4px 16px; }
  .alr-fond { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.62); display: grid; place-items: center; padding: 18px; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  .alr { width: 100%; max-width: 380px; max-height: calc(100vh - 40px); overflow: auto; background: #171b26; color: #e8ebf2; border: 1px solid #2a3042; border-radius: 22px; padding: 20px 18px 14px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.6); animation: alr-in .22s ease-out; }
  .alr.rouge { border-color: #5b2228; } .alr.jaune { border-color: #5b4312; } .alr.bleu { border-color: #1e3a66; }
  @keyframes alr-in { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .alr-ic { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 10px; display: grid; place-items: center; font-size: 32px; }
  .alr h3 { font-size: 18px; margin: 0 0 6px; }
  .alr-tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 20px; margin-bottom: 10px; }
  .alr-cl { font-size: 16px; font-weight: 800; margin-bottom: 3px; }
  .alr-pr { font-size: 13px; color: #aab3c5; line-height: 1.45; margin-bottom: 12px; }
  .alr-note { font-size: 12.5px; color: #c8cdd8; background: #11141c; border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
  .alr-liste { text-align: left; font-size: 13.5px; line-height: 1.8; background: #11141c; border-radius: 12px; padding: 8px 12px; margin: 8px 0 4px; }
  .alr-steps { text-align: right; direction: rtl; background: #11141c; border-radius: 12px; padding: 9px 12px; margin-bottom: 8px; font-size: 13.5px; line-height: 1.9; }
  .alr-steps .d { color: #4ade80; } .alr-steps .n { color: #8a93a6; }
  .alr-2 { display: flex; gap: 8px; }
  .alr-b { display: block; flex: 1; width: 100%; padding: 13px; border-radius: 12px; font-weight: 800; font-size: 15px; margin-top: 8px; border: 0; cursor: pointer; text-decoration: none; text-align: center; font-family: inherit; }
  .alr-b.ok { background: #22c55e; color: #04210f; } .alr-b.ok:disabled { background: #232838; color: #5e6678; }
  .alr-b.gr { background: #232838; color: #e8ebf2; } .alr-b.wa { background: #123222; color: #4ade80; }
  .alr-tard { background: none; border: 0; color: #8a93a6; font-size: 12.5px; margin-top: 10px; padding: 6px; cursor: pointer; font-family: inherit; }
  .alr-opts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 10px; }
  .alr-o { font-size: 13px; font-weight: 700; padding: 9px 12px; border-radius: 20px; border: 1px solid #2f3648; background: none; color: #e8ebf2; cursor: pointer; font-family: inherit; }

const st = { res: null, resQ: '', tabQ: null, cherche: null, pin: '', agent: '', role: '', commandes: [], tab: 'new', q: '', page: 1, ouvert: new Set(), brouillon: {}, villes: [], stats: [], periode: '7j', clPer: 'semaine', view: 'orders', at: 0, busy: false };

async function api(action, extra = {}) {

// ---------- login ----------

async function charger(silencieux) {
  if (st.busy) return; st.busy = true;
  $('#refresh').classList.add('spin');

    const per = st.role === 'admin' ? $('#f-jours').value : '';

    const extra = st.role === 'admin' ? { filtre: $('#f-agent').value, jours: jourVoulu === null ? Number(per) : jourVoulu + 1 } : {};

    const jourDe = t => { const x = new Date(t); return isNaN(x) ? '' : x.toISOString().slice(0, 10); };
    const cible = jourVoulu === null ? null : new Date(Date.now() - jourVoulu * 86400000).toISOString().slice(0, 10);
    st.commandes = cible ? d.commandes.filter(o => jourDe(o.date) === cible) : d.commandes; st.at = Date.now();

// ---------- discussion d'équipe (chat interne) ----------
const CHAT_GENS = ['ADMIN', 'HAJIBA', 'BTISSAM', 'GHIZLANE', 'SAMIRA', 'ILHAM'];
const chat = { msgs: [], ouvert: false, conv: null, ref: '', lus: {}, charge: false };
const nomChat = a => a === 'EQUIPE' ? "Toute l'équipe" : a === 'ADMIN' ? 'Admin' : nomPropre(a);
const couleurChat = a => a === 'EQUIPE' ? '#475569' : a === 'ADMIN' ? '#11141c' : (COULEURS[a] || '#3651d4');

function marquerLu(c) {
  chat.lus[c] = new Date().toISOString(); store.set('chat_lus_' + st.agent, JSON.stringify(chat.lus)); majBadgeChat();

const CHAT_GROUPE = ['ADMIN', 'HAJIBA', 'BTISSAM', 'GHIZLANE', 'SAMIRA', 'ILHAM'];

    el('div', { class: 'lu-sheet' }, el('div', { class: 'lu-grab' }),
      el('h3', { text: 'Lu par' }), ...(r.lu.length ? r.lu.sort((a, b) => a.q < b.q ? -1 : 1).map(o => ligne(o.x, o.q)) : [el('p', { class: 'lu-vide', text: 'Personne pour le moment.' })]),

const nonLus = c => chat.msgs.filter(m => m.de !== st.agent && convDe(m) === c && m.quand > (chat.lus[c] || '')).length;

// nouveaux messages reçus : son « double bip » + bandeau en haut (sauf si la conversation est déjà ouverte)
let chatVus = null;

  const recus = chat.msgs.filter(m => m.id && !m.envoi && m.de !== st.agent);

function rerender() { const y = window.scrollY; rendre(); window.scrollTo(0, y); }
async function enregistrer(o, key, btn) {
  const b = st.brouillon[key];
  const champs = {};
  for (const k of Object.keys(b)) if ((b[k] ?? '') !== (o[k] ?? '')) champs[k] = b[k];
  if (!Object.keys(champs).length) { st.ouvert.delete(key); rerender(); return; }
  if (champs.statut === 'CONFIRMER' && !(champs.ville || o.ville)) { toast('Choisissez la ville avant de confirmer.', true); st.ouvert.add(key); rerender(); return; }
  if (champs.ville && st.villes.length && !st.villes.includes(champs.ville)) { toast('Choisissez une ville de la liste.', true); return; }
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  try {
    const d = await api('maj', { row: o.row, id: o.id, champs });
    Object.assign(o, champs);
    if (d.champs && d.champs.agent !== undefined) o.agent = String(d.champs.agent).toUpperCase();
    delete st.brouillon[key]; st.ouvert.delete(key);
    toast('Enregistré'); rerender();
  } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = 'Enregistrer'; }

// ---------- KPIs + performance ----------
const fmt = n => (Number(n) || 0).toLocaleString('fr-FR');
const pct = n => (Math.round((Number(n) || 0) * 10) / 10).toLocaleString('fr-FR') + ' %';
function rendreKpis() {
  const moi = st.role === 'admin' ? 'TOTAL' : st.agent;
  const auj = st.stats.find(r => r.agent === moi && r.periode === 'aujourdhui') || {};
  const s7 = st.stats.find(r => r.agent === moi && r.periode === '7j') || {};
  const per = st.role === 'admin' ? $('#f-jours').value : '';
  if (per === 'auj' || per === 'hier') {
    // la période choisie (aujourd'hui / hier) : calculé sur les commandes affichées
    const lab = per === 'hier' ? 'hier' : 'auj.';
    const cmds = st.commandes.filter(o => o.row);
    const conf = cmds.filter(o => o.statut === 'CONFIRMER').length;
    const dbl = cmds.filter(o => o.statut === 'DOUBLE').length;
    $('#kpis').replaceChildren(
      el('div', { class: 'kpi' }, el('span', { text: 'Commandes · ' + lab }), el('b', { text: fmt(cmds.length) })),
      el('div', { class: 'kpi' }, el('span', { text: 'Confirmées · ' + lab }), el('b', { text: fmt(conf) })),
      el('div', { class: 'kpi' }, el('span', { text: 'Confirmation · ' + lab }), el('b', { text: cmds.length - dbl > 0 ? pct(conf / (cmds.length - dbl) * 100) : '—' })),
      el('div', { class: 'kpi' }, el('span', { text: 'Livraison · 7 j' }), el('b', { text: pct(s7.taux_livr) })),
    );
    return;
  }
  $('#kpis').replaceChildren(
    el('div', { class: 'kpi' }, el('span', { text: "Commandes · auj." }), el('b', { text: fmt(auj.assignes) })),
    el('div', { class: 'kpi' }, el('span', { text: "Confirmées · auj." }), el('b', { text: fmt(auj.confirmes) })),
    el('div', { class: 'kpi' }, el('span', { text: 'Confirmation · 7 j' }), el('b', { text: pct(s7.taux_conf) })),
    el('div', { class: 'kpi' }, el('span', { text: 'Livraison · 7 j' }), el('b', { text: pct(s7.taux_livr) })),
  );
}
function anneau(taux, col) {
  const NS = 'http://www.w3.org/2000/svg', R = 28, L = 2 * Math.PI * R;
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 66 66'); svg.setAttribute('class', 'ring');
  const c1 = document.createElementNS(NS, 'circle'); Object.entries({ cx: 33, cy: 33, r: R, fill: 'none', stroke: 'var(--line-2)', 'stroke-width': 6 }).forEach(([k, v]) => c1.setAttribute(k, v));
  const c2 = document.createElementNS(NS, 'circle'); Object.entries({ cx: 33, cy: 33, r: R, fill: 'none', stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-dasharray': (L * Math.min(100, Math.max(0, taux)) / 100) + ' ' + L, transform: 'rotate(-90 33 33)' }).forEach(([k, v]) => c2.setAttribute(k, v));
  const t = document.createElementNS(NS, 'text'); Object.entries({ x: 33, y: 38, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 800, fill: 'currentColor' }).forEach(([k, v]) => t.setAttribute(k, v)); t.textContent = Math.round(taux) + '%';
  svg.append(c1, c2, t); return svg;
}
function cell(v, label, ton) { return el('div', { class: 'cell' + (ton ? ' ' + ton : '') }, el('b', { text: v }), el('span', { text: label })); }
const CL_AGENTES = ['HAJIBA', 'BTISSAM', 'GHIZLANE', 'SAMIRA', 'ILHAM'];
function rendreClassement() {
  const per = st.clPer;
  const rows = CL_AGENTES.map(a => {
    const r = st.stats.find(x => x.agent === a && x.periode === per) || {};
    const l = Number(r.livres) || 0, rt = Number(r.retours) || 0, f = l + rt;
    return { agent: a, l, rt, f, taux: f ? l * 100 / f : -1, ca: Number(r.ca_livre) || 0 };
  }).sort((a, b) => b.l - a.l || b.taux - a.taux);
  const col = a => COULEURS[a] || 'var(--brand)';
  const ton = t => t < 0 ? 'var(--muted)' : t >= 50 ? 'var(--ok)' : t >= 35 ? 'var(--warn)' : 'var(--bad)';
  const tx = t => t < 0 ? '—' : t.toFixed(1).replace('.', ',') + ' %';
  const med = ['🥇', '🥈', '🥉'];
  const max = Math.max(1, ...rows.map(r => r.l));
  const pod = [1, 0, 2].filter(i => rows[i] && rows[i].l).map(i => el('div', { class: 'p' + (i === 0 ? ' p1' : '') },
    el('div', { class: 'av', style: 'background:' + col(rows[i].agent), text: rows[i].agent.slice(0, 2) }, el('span', { class: 'md', text: med[i] })),
    el('b', { text: nomPropre(rows[i].agent) }), el('small', { text: fmt(rows[i].l) + ' livrées' }),
    el('div', { class: 'bloc', style: 'height:' + [80, 58, 42][i] + 'px', text: String(i + 1) })));
  const liste = rows.map((r, i) => el('div', { class: 'cl-l' },
    el('span', { class: 'r', text: String(i + 1) }),
    el('div', { class: 'avatar', style: 'background:' + col(r.agent), text: r.agent.slice(0, 2) }),
    el('div', { class: 'x' },
      el('b', {}, el('span', { text: nomPropre(r.agent) }), el('span', { style: 'color:var(--ok)', text: fmt(r.l) + ' livrées' })),
      el('div', { class: 'cl-bar' }, el('i', { style: 'width:' + (max ? r.l * 100 / max : 0) + '%;background:var(--ok)' })),
      el('span', { text: r.f ? '↩️ ' + fmt(r.rt) + ' retours · taux ' + tx(r.taux) + ' · ' + fmt(r.ca) + ' DH' : 'Pas encore de colis livré' }))));
  $('#cl-sub').textContent = 'Selon les commandes livrées · ' + ({ semaine: 'du lundi à aujourd\'hui', sem_prec: 'lundi → dimanche dernier', '30j': '30 derniers jours' }[per] || '');
  $('#cl-body').replaceChildren(...[pod.length ? el('div', { class: 'podium' }, ...pod) : null, el('div', { class: 'cl-list' }, ...liste)].filter(Boolean));
}
for (const b of document.querySelectorAll('#cl-periods .tab')) b.addEventListener('click', () => {
  st.clPer = b.dataset.c; for (const x of document.querySelectorAll('#cl-periods .tab')) x.setAttribute('aria-pressed', String(x === b)); rendreClassement();
});
function rendrePerf() {

      el('div', { class: 'phead' }, el('div', { class: 'avatar', style: 'background:' + col, text: r.agent.slice(0, 2) }), el('b', { text: nomPropre(r.agent) })),
      el('div', { class: 'ring-row' }, anneau(Number(r.taux_conf) || 0, col), el('div', {}, el('div', { class: 'big', text: fmt(r.confirmes) }), el('div', { class: 'sub', text: 'confirmées sur ' + fmt(r.assignes) + ' commandes' }))),
      el('div', { class: 'cells' },
        cell(fmt(r.annules), 'Annulées', Number(r.annules) ? 'bad' : ''), cell(fmt(r.pas_repond), 'Pas répondu', Number(r.pas_repond) ? 'warn' : ''), cell(fmt(r.en_attente), 'En attente'),
        cell(fmt(r.livres), 'Livrées', 'ok'), cell(fmt(r.retours) + (r.retours_recus != null ? ' · ' + fmt(r.retours_recus) + ' reçus' : ''), 'Retours', Number(r.retours) ? 'bad' : ''), cell(fermes ? pct(tl) : '—', 'Taux livraison', !fermes ? '' : tl >= 50 ? 'ok' : tl >= 35 ? 'warn' : 'bad'),
        cell(fmt(r.en_cours), 'En cours'), cell(fmt(r.colis), 'Colis'), cell(fmt(r.ca_livre) + ' DH', 'CA livré'),
        cell(r.delai_min ? fmt(r.delai_min) + ' min' : '—', '1er appel (moy.)', !r.delai_min ? '' : r.delai_min <= 15 ? 'ok' : r.delai_min <= 60 ? 'warn' : 'bad'),

    el('div', { class: 'phead' }, el('div', { class: 'avatar', style: 'background:var(--ink);color:var(--panel)', text: 'Σ' }), el('b', { text: 'Total équipe' })),
    el('div', { class: 'ring-row' }, anneau(Number(tot.taux_conf) || 0, 'var(--brand)'), el('div', {}, el('div', { class: 'big', text: fmt(tot.confirmes) }), el('div', { class: 'sub', text: 'confirmées sur ' + fmt(tot.assignes) + ' commandes' }))),
    el('div', { class: 'cells' }, cell(fmt(tot.livres), 'Livrées', 'ok'), cell(fmt(tot.retours), 'Retours', 'bad'), cell(pct(tot.taux_livr), 'Taux livraison'), cell(fmt(tot.en_cours), 'En cours'), cell(fmt(tot.en_attente), 'En attente'), cell(fmt(tot.ca_livre) + ' DH', 'CA livré'), cell(tot.delai_min ? fmt(tot.delai_min) + ' min' : '—', '1er appel (moy.)')),
    el('div', { class: 'soc-titre', text: 'Par société de livraison' }),
    el('div', { class: 'cells' },
      cell('Irsaliyat', 'Société'), cell(fmt(tot.livres_iry), 'Livrées', 'ok'), cell(fmt(tot.ca_iry) + ' DH', 'CA livré'),
      cell('Colya Casa', 'Société'), cell(fmt(tot.livres_colya), 'Livrées', 'ok'), cell(fmt(tot.ca_colya) + ' DH', 'CA livré'),
    ),
  ));
  $('#pgrid').replaceChildren(...(cartes.length ? cartes : [el('div', { class: 'empty', text: 'Aucune activité sur cette période.' })]));
  const maj = (tot || rows[0] || {}).maj;
  if (maj) $('#perf-note').textContent = 'Taux de confirmation = confirmées ÷ (commandes − doublons). Taux de livraison = livrées ÷ (livrées + retours). Dernier calcul : ' + maj + '.';
}
for (const b of document.querySelectorAll('#periods .tab')) b.addEventListener('click', () => {

});
